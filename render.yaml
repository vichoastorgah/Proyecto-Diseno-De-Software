# Render Blueprint (infrastructure as code) for the single-service deployment.
# Dashboard: New > Blueprint > this repository. Values marked `sync: false` are asked for
# in the dashboard and never stored in Git. SESSION_SECRET is generated by Render.
# Render also sets PORT, RENDER=true and RENDER_EXTERNAL_URL (used as the public app URL).
services:
  - type: web
    name: voting-survey-system
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL # Supabase > Connect > Session pooler URI + ?sslmode=require
        sync: false
      - key: SUPABASE_URL # https://<project-ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY # Supabase secret key (sb_secret_...)
        sync: false
      - key: SUPABASE_BUCKET
        value: attachments
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS # comma-separated Google accounts with the admin role
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEFAULT_EMAIL_LANGUAGE
        value: es
      - key: ALLOW_DEMO_SURVEY_IDENTITY # lets an admin "act as" someone in surveys (demo)
        value: "true"
